[project]
name = "blinddrive"
version = "0.1.0"
description = "BlindDrive: a small, auditable partial-observation online driving benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blinddrive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
